spring.application.name={{name}}

# Bedrock Converse model. MODEL_ID is injected by the runtime; override locally as needed.
spring.ai.bedrock.converse.chat.model=${MODEL_ID:us.amazon.nova-pro-v1:0}
spring.ai.bedrock.converse.chat.max-tokens=4096
spring.ai.bedrock.converse.chat.temperature=0.7
spring.ai.bedrock.aws.timeout=120s

# Agent system prompt (SYSTEM_PROMPT env overrides it when set).
agent.system-prompt=${SYSTEM_PROMPT:You are a helpful AI assistant. Be concise, accurate, and friendly.}

# Health probes back the AgentCore /ping contract; metrics are opt-in.
management.endpoints.web.exposure.include=${MANAGEMENT_ENDPOINTS:health}
management.endpoint.health.probes.enabled=true

# Retry transient / throttling errors from the model.
spring.ai.retry.max-attempts=3
spring.ai.retry.backoff.initial-interval=1s
spring.ai.retry.backoff.max-interval=10s
