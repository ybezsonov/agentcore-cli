spring.application.name={{name}}

{{#if (eq modelProvider "Bedrock")}}
# Bedrock Converse model. MODEL_ID is injected by the runtime; override locally as needed.
spring.ai.bedrock.converse.chat.model={{{modelRef modelId "us.amazon.nova-pro-v1:0"}}}
spring.ai.bedrock.converse.chat.max-tokens={{#if modelMaxTokens}}{{modelMaxTokens}}{{else}}4096{{/if}}
spring.ai.bedrock.converse.chat.temperature=0.7
spring.ai.bedrock.aws.timeout=120s
{{/if}}
{{#if (eq modelProvider "OpenAI")}}
# OpenAI model. The API key is injected at deploy from the AgentCore credential env var; locally it
# falls back to a placeholder so the app still boots inert (the key is read only on the first
# request). MODEL_ID is injected by the runtime; override locally as needed.
spring.ai.openai.api-key={{{modelApiKeyRef}}}
spring.ai.openai.chat.model={{{modelRef modelId "gpt-4.1"}}}
spring.ai.openai.chat.max-tokens={{#if modelMaxTokens}}{{modelMaxTokens}}{{else}}4096{{/if}}
spring.ai.openai.chat.temperature=0.7
{{/if}}
{{#if (eq modelProvider "Anthropic")}}
# Anthropic (Claude) model. Same credential + inert-boot contract as the OpenAI block above.
spring.ai.anthropic.api-key={{{modelApiKeyRef}}}
spring.ai.anthropic.chat.model={{{modelRef modelId "claude-sonnet-4-5-20250514"}}}
spring.ai.anthropic.chat.max-tokens={{#if modelMaxTokens}}{{modelMaxTokens}}{{else}}4096{{/if}}
spring.ai.anthropic.chat.temperature=0.7
{{/if}}
{{#if (eq modelProvider "Gemini")}}
# Google Gemini model (Gemini Developer API). Same credential + inert-boot contract as above.
spring.ai.google.genai.api-key={{{modelApiKeyRef}}}
spring.ai.google.genai.chat.model={{{modelRef modelId "gemini-2.5-flash"}}}
spring.ai.google.genai.chat.max-output-tokens={{#if modelMaxTokens}}{{modelMaxTokens}}{{else}}4096{{/if}}
spring.ai.google.genai.chat.temperature=0.7
{{/if}}

# Agent system prompt.
{{#if systemPromptText}}
# Baked verbatim from the exported harness's system prompt (escaped to a single .properties line).
agent.system-prompt={{escapeProps systemPromptText}}
{{else}}
# SYSTEM_PROMPT env overrides it when set.
agent.system-prompt=${SYSTEM_PROMPT:You are a helpful AI assistant. Be concise, accurate, and friendly.}
{{/if}}
{{#if hasMemory}}

# AgentCore Memory. The memory id itself is NOT set here: MemoryEnvironmentPostProcessor bridges the
# MEMORY_<NAME>_ID runtime env var to agentcore.memory.memory-id ONLY when it is present, so with no
# env var (local runs before deploy) the property stays absent, the memory auto-configuration
# self-gates off, and the app boots inert. The settings below are read only once memory activates.
agentcore.memory.long-term.auto-discovery=true
# Persist tool-call/result turns to short-term memory instead of failing on unknown message roles
# (Spring AI routes ToolResponseMessage through ChatMemory on tool-using turns).
agentcore.memory.ignore-unknown-roles=true
{{/if}}
{{#if hasMcpClient}}

# MCP client (streamable HTTP) — AgentCore Gateway tools (SigV4, per-gateway auth) and/or remote
# (non-gateway) MCP servers. Enabled when at least one remote MCP server is configured (its URL is
# static, below); for a gateway-only agent it stays disabled here and GatewayEnvironmentPostProcessor
# flips it to true once the AGENTCORE_GATEWAY_<NAME>_URL env var is injected at deploy — so the agent
# still boots inert locally. Connect lazily (not at boot) so an MCP outage can't block startup.
spring.ai.mcp.client.enabled={{#if remoteMcpTools}}true{{else}}false{{/if}}
spring.ai.mcp.client.toolcallback.enabled=true
spring.ai.mcp.client.initialized=false
{{#each remoteMcpTools}}
spring.ai.mcp.client.streamable-http.connections.{{name}}.url={{{url}}}
{{/each}}
{{/if}}
{{#if hasBrowser}}

# AgentCore Browser. `agentcore` mode uses the AWS-managed remote browser (browser/aws.browser.v1),
# driven over CDP — no local Chromium (that is `local` mode). The Playwright bean is lazy, so the app
# boots inert until the browser tool is first invoked; the runtime role's browser-session IAM is
# granted at deploy via the browser connection.
agentcore.browser.mode=agentcore
{{#if browserIdentifierEnvVar}}
# Target a specific (customer-owned) browser resource. The runtime injects the browser id at deploy
# from the browser connection; absent (local), fall back to the AWS-managed default (aws.browser.v1).
agentcore.browser.browser-identifier={{{envRef browserIdentifierEnvVar "aws.browser.v1"}}}
{{/if}}
{{/if}}
{{#if codeInterpreterIdentifierEnvVar}}

# Target a specific (customer-owned) code-interpreter resource. The runtime injects the id at deploy
# from the code-interpreter connection; absent (local), fall back to the AWS-managed default.
agentcore.code-interpreter.code-interpreter-identifier={{{envRef codeInterpreterIdentifierEnvVar "aws.codeinterpreter.v1"}}}
{{/if}}

# Health probes back the AgentCore /ping contract; metrics are opt-in.
management.endpoints.web.exposure.include=${MANAGEMENT_ENDPOINTS:health}
management.endpoint.health.probes.enabled=true

# Retry transient / throttling errors from the model.
spring.ai.retry.max-attempts=3
spring.ai.retry.backoff.initial-interval=1s
spring.ai.retry.backoff.max-interval=10s
