spring.application.name={{name}}

# Bedrock Converse model. Override locally via MODEL_ID.
spring.ai.bedrock.converse.chat.model=${MODEL_ID:{{#if modelId}}{{modelId}}{{else}}global.anthropic.claude-sonnet-4-5-20250929-v1:0{{/if~}} }
spring.ai.bedrock.converse.chat.max-tokens={{modelMaxTokens}}
spring.ai.bedrock.aws.region=${AWS_REGION:us-east-1}
spring.ai.bedrock.aws.timeout=120s
# Read timeout for streaming responses.
spring.ai.bedrock.aws.async-read-timeout=120s
# Unlisted tool names resolve through UnknownToolConfig, which returns a tool error to the model.
spring.ai.tools.resolution.fallback.enabled=true

agent.system-prompt={{{escapeProps systemPrompt}}}
{{#if hasMemory}}

# The memory id and long-term auto-discovery are bridged only when {{memoryProviders.[0].envVarName}} is non-blank.
{{#if sessionTotalEventsLimit}}
agentcore.memory.short-term.total-events-limit={{sessionTotalEventsLimit}}
{{/if}}
{{/if}}
{{#if (or hasGateway remoteMcpTools.length)}}

# Connect to MCP servers on first use, not at startup.
spring.ai.mcp.client.initialized=false
spring.ai.mcp.client.annotation-scanner.enabled=false
{{#each remoteMcpTools}}
spring.ai.mcp.client.streamable-http.connections.{{name}}.url={{{url}}}
{{/each}}
{{/if}}
{{#if browserIdentifierEnvVar}}
agentcore.browser.browser-identifier=${ {{~browserIdentifierEnvVar~}} :aws.browser.v1}
{{/if}}
{{#if codeInterpreterIdentifierEnvVar}}
agentcore.code-interpreter.code-interpreter-identifier=${ {{~codeInterpreterIdentifierEnvVar~}} :aws.codeinterpreter.v1}
{{/if}}
